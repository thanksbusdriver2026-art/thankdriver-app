<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🚌 Thank Your Driver</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">
      <i class="fas fa-school-bus"></i>
      <span>Thank<span>Driver</span></span>
    </div>
    <div id="authStatus">
      <button onclick="showAuth()" class="btn btn-primary">Sign In</button>
    </div>
  </header>

  <main>
    <h1>🙏 Thank Your School Bus Driver</h1>
    <p>Show appreciation to the heroes who drive our future.</p>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search drivers..." onkeyup="searchDrivers()">
      <button onclick="searchDrivers()" class="btn btn-primary">Search</button>
    </div>

    <div id="driverList"></div>

    <div id="driverProfile" style="display:none;"></div>
  </main>

  <div id="authModal" class="modal" style="display:none;">
    <div class="modal-content">
      <span class="close" onclick="closeAuth()">&times;</span>
      <h2 id="authTitle">Sign In</h2>
      <div id="loginForm">
        <input type="email" id="loginEmail" placeholder="Email">
        <input type="password" id="loginPassword" placeholder="Password">
        <button onclick="handleLogin()" class="btn btn-primary">Sign In</button>
        <p>Don't have an account? <a href="#" onclick="showRegister()">Register</a></p>
      </div>
      <div id="registerForm" style="display:none;">
        <input type="text" id="regName" placeholder="Full Name">
        <input type="email" id="regEmail" placeholder="Email">
        <input type="password" id="regPassword" placeholder="Password">
        <button onclick="handleRegister()" class="btn btn-primary">Register</button>
        <p>Already have an account? <a href="#" onclick="showLogin()">Sign In</a></p>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
