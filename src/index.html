<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🚌 Thank Your Driver</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <!-- Top Bar -->
  <header>
    <div class="logo">
      <i class="fas fa-school-bus"></i>
      <span>Thank<span>Driver</span></span>
    </div>
    <div class="auth-status" id="authStatus">
      <button onclick="showAuthModal()" id="authBtn">
        <i class="fas fa-user"></i> Sign In
      </button>
    </div>
  </header>

  <!-- Auth Modal -->
  <div id="authModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="authTitle">Sign In</h2>
        <button class="close-btn" onclick="closeAuthModal()">&times;</button>
      </div>
      
      <!-- Login Form -->
      <div id="loginForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="loginEmail" placeholder="driver@example.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••">
        </div>
        <button class="btn btn-primary" onclick="handleLogin()">
          <i class="fas fa-sign-in-alt"></i> Sign In
        </button>
        <p class="auth-switch">
          Don't have an account? <a href="#" onclick="showRegister()">Register as Driver</a>
        </p>
      </div>
      
      <!-- Register Form -->
      <div id="registerForm" style="display:none;">
        <div class="form-group">
          <label>Full Name *</label>
          <input type="text" id="regName" placeholder="John Doe">
        </div>
        <div class="form-group">
          <label>Email *</label>
          <input type="email" id="regEmail" placeholder="driver@example.com">
        </div>
        <div class="form-group">
          <label>Password *</label>
          <input type="password" id="regPassword" placeholder="••••••••">
        </div>
        <div class="form-group">
          <label>Company</label>
          <input type="text" id="regCompany" placeholder="e.g. First Student">
        </div>
        <div class="form-group">
          <label>Bus Number</label>
          <input type="text" id="regBusNumber" placeholder="e.g. #12">
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" id="regPhone" placeholder="(555) 123-4567">
        </div>
        <div class="form-group">
          <label>Bio (optional)</label>
          <textarea id="regBio" placeholder="Tell us about yourself..."></textarea>
        </div>
        <div class="form-group">
          <label>Years of Experience</label>
          <input type="number" id="regYears" placeholder="5">
        </div>
        <div class="form-group">
          <label>Wishlist Items</label>
          <div id="wishlistContainer">
            <div class="wishlist-input">
              <input type="text" placeholder="Item name" class="wishlist-name">
              <input type="number" placeholder="Points" class="wishlist-points">
              <button onclick="addWishlistItem()" class="btn-sm btn-primary">
                <i class="fas fa-plus"></i>
              </button>
            </div>
          </div>
        </div>
        <button class="btn btn-primary" onclick="handleRegister()">
          <i class="fas fa-user-plus"></i> Register as Driver
        </button>
        <p class="auth-switch">
          Already have an account? <a href="#" onclick="showLogin()">Sign In</a>
        </p>
        <div class="info-box">
          <i class="fas fa-info-circle"></i> 
          Your registration will be reviewed by an admin before approval.
        </div>
      </div>
    </div>
  </div>

  <!-- ===== MAIN CONTENT ===== -->
  <div class="container">
    
    <!-- Welcome Section -->
    <section id="welcomeSection">
      <h1>🙏 Thank Your School Bus Driver</h1>
      <p>Show appreciation to the heroes who drive our future.</p>
      <div class="stats-banner">
        <div class="stat">
          <span id="totalDrivers">0</span>
          <label>Drivers</label>
        </div>
        <div class="stat">
          <span id="totalThanks">0</span>
          <label>Thank Yous</label>
        </div>
        <div class="stat">
          <span id="totalPoints">0</span>
          <label>Points Given</label>
        </div>
      </div>
    </section>

    <!-- Search Section -->
    <section id="searchSection">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search drivers by name, company, or bus..." onkeyup="if(event.key==='Enter') searchDrivers()">
        <button onclick="searchDrivers()" class="btn btn-primary">
          <i class="fas fa-search"></i> Search
        </button>
      </div>
      <div id="searchResults"></div>
    </section>

    <!-- Driver Profile / Thank You Page -->
    <section id="driverProfile" style="display:none;">
      <div id="driverProfileContent"></div>
    </section>

    <!-- Admin Panel (hidden by default) -->
    <section id="adminPanel" style="display:none;">
      <div id="adminContent"></div>
    </section>

  </div>

  <!-- ===== TOAST NOTIFICATIONS ===== -->
  <div id="toast"></div>

  <!-- App JavaScript -->
  <script src="app.js"></script>
</body>
</html>
